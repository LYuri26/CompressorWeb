; ============================================================================
; PROJETO: EnergizAR - Sistema de Automação e Monitoramento ESP32
; ARQUIVO: platformio.ini
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidade do Monitor Serial e Upload
monitor_speed = 115200
upload_speed = 921600

; Filtros do Monitor Serial
monitor_filters =
    esp32_exception_decoder
    time

; Tabela de partições da memória flash
board_build.partitions = default.csv

; Dependências do projeto
lib_deps =
    arduino-libraries/NTPClient@^3.2.1
    https://github.com/mathieucarbou/AsyncTCP.git
    https://github.com/mathieucarbou/ESPAsyncWebServer.git
    adafruit/Adafruit BusIO@^1.16.1

; Flags de compilação
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ASYNCWEBSERVER_REGEX